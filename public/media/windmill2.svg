  <path d="M980 1060h35M980 1073h35M980 1086h28M980 1099h35" stroke="#64748B" stroke-width="3"/>
</g>

<!-- subtle decorative renewable-energy arcs -->
<path d="M780 610 Q930 520 1050 610" fill="none" stroke="#B9E4E2" stroke-width="6" stroke-linecap="round"/>
<path d="M800 630 Q930 560 1030 630" fill="none" stroke="#D9F4F2" stroke-width="4" stroke-linecap="round"/>

</svg>