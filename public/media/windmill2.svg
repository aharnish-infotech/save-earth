  <path d="M850 955 Q900 930 948 958 L950 1075 Q900 1100 852 1075Z" fill="#F97316"/>
  <path d="M855 985 Q900 1000 946 985" fill="none" stroke="#FFE9A8" stroke-width="8"/>
  <path d="M860 1008 Q900 1020 944 1008" fill="none" stroke="#FFE9A8" stroke-width="8"/>
  <!-- arms -->
  <path d="M858 970 Q825 1010 790 955 L805 945 Q830 970 870 950Z" fill="#C0267D"/>
  <path d="M943 970 Q970 1010 990 1050 L975 1060 Q940 1030 930 995Z" fill="#C0267D"/>
