  <circle cx="900" cy="920" r="34" fill="#F3B49A"/>
  <!-- hair -->
  <path d="M865 915 Q870 870 915 875 Q950 885 936 925 Q925 900 905 902 Q890 920 865 915Z" fill="#1976D2"/>
  <path d="M875 900 Q850 915 858 950 Q870 965 883 945 L880 920Z" fill="#1976D2"/>
  <!-- cap -->
  <path d="M866 891 Q900 865 930 890 L925 903 L875 903Z" fill="#2563EB"/>
  <!-- hand pointing -->
  <circle cx="795" cy="951" r="9" fill="#F3B49A"/>
  <!-- clipboard -->
