  <path d="M870 1080 L900 1080 L885 1170 L855 1170Z" fill="#1976A8"/>
  <path d="M915 1080 L942 1082 L958 1168 L930 1170Z" fill="#1976A8"/>
  <ellipse cx="868" cy="1175" rx="24" ry="8" fill="#3D245A"/>
  <ellipse cx="946" cy="1173" rx="24" ry="8" fill="#3D245A"/>
